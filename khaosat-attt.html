else out.push([n,r[0],r[1],r[2],r[3],r[4],r[5],r[8],g(9),g(10),g(11),g(12),r[13],[r[6],r[7],r[14]].filter(Boolean).join(" · ")])})});return out}
if(!SEND_URL)$("#bs").hidden=true;
$("#bs").onclick=async()=>{if(!(V.a1||"").trim()){toast("Hãy nhập tên đơn vị ở mục A1 trước khi gửi");return}
const b=$("#bs"),dd=dvRows(),ct=[0,0,0];dd.forEach(r=>{const i=RT.indexOf(r[12]);if(i>=0)ct[i]++});
const body=JSON.stringify({key:SEND_KEY,unit:V.a1,system:V.a2||"",person:V.n1||"",p:LAST.p,T:LAST.T,Dn:LAST.Dn,deps:LAST.d,devices:dd,counts:[dd.length,...ct],raw:JSON.stringify(V)});
b.disabled=true;b.textContent="Đang gửi…";const H={"Content-Type":"text/plain;charset=utf-8"};
try{const r=await fetch(SEND_URL,{method:"POST",headers:H,body}),j=await r.json();toast(j.ok?"Đã gửi thành công. Cảm ơn đơn vị!":"Gửi chưa thành công – hãy tải file .json gửi thay")}
catch(e){try{await fetch(SEND_URL,{method:"POST",mode:"no-cors",headers:H,body});toast("Đã gửi (chưa xác nhận được) – nên tải thêm file .json gửi dự phòng")}catch(x){toast("Không gửi được – hãy tải file .json gửi thay")}}
b.disabled=false;b.textContent="Gửi về cho đơn vị khảo sát"};
$("#bd").onclick=()=>{try{const u=URL.createObjectURL(new Blob([JSON.stringify(V,null,1)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="khao-sat-attt-"+((V.a1||"don-vi").trim().replace(/[^\w\u00C0-\u1EF9]+/g,"-").slice(0,40)||"don-vi")+".json";document.body.appendChild(a);a.click();a.remove();toast("Đã tải file dữ liệu")}catch(e){toast("Không tải được – hãy dùng Sao chép dữ liệu")}};
$("#bi").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);if(typeof o!=="object"||!o)throw 0;V=o;try{localStorage.setItem(K,JSON.stringify(V))}catch(x){}render();toast("Đã mở file dữ liệu")}catch(x){toast("File không đúng định dạng")}};rd.readAsText(fl);e.target.value=""};
render();
</script>
